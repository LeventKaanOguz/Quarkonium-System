name: clang-format

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Arch Linux ships the current clang-format (the same major version used locally).
    container: archlinux:latest
    steps:
      - name: Install clang-format
        run: pacman -Syu --noconfirm --needed clang findutils
      - uses: actions/checkout@v5
      - name: Check formatting
        run: find src tests -regex '.*\.\(cpp\|hpp\)' -exec clang-format --dry-run --Werror {} +
